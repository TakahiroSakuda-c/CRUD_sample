<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社員管理CRUDサンプル</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 30px;
    background-color: #f5f5f5;
}

.container {
    max-width: 900px;
    margin: auto;
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

h1 {
    margin-top: 0;
}

.form-area {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.form-area input {
    padding: 8px;
    flex: 1;
}

button {
    padding: 8px 12px;
    cursor: pointer;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    border: 1px solid #ddd;
    padding: 8px;
}

th {
    background-color: #f0f0f0;
}

.action-buttons button {
    margin-right: 5px;
}

.edit-btn {
    background-color: #2196F3;
    color: white;
    border: none;
}

.delete-btn {
    background-color: #f44336;
    color: white;
    border: none;
}

.save-btn {
    background-color: #4CAF50;
    color: white;
    border: none;
}
</style>
</head>

<body>

<div class="container">
    <h1>社員管理CRUDサンプル</h1>

    <div class="form-area">
        <input type="text" id="name" placeholder="氏名">
        <input type="email" id="email" placeholder="メールアドレス">
        <button id="saveButton" class="save-btn">登録</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>氏名</th>
                <th>メールアドレス</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="userTableBody"></tbody>
    </table>
</div>

<script>
// 初期データ
let users = [
    {
        id: 1,
        name: "山田 太郎",
        email: "yamada@example.com"
    },
    {
        id: 2,
        name: "鈴木 花子",
        email: "suzuki@example.com"
    },
    {
        id: 3,
        name: "佐藤 次郎",
        email: "sato@example.com"
    },
    {
        id: 4,
        name: "高橋 美咲",
        email: "takahashi@example.com"
    },
    {
        id: 5,
        name: "伊藤 健",
        email: "ito@example.com"
    }
];

let nextId = 6;
let editingId = null;

function renderTable() {
    const tbody = document.getElementById("userTableBody");
    tbody.innerHTML = "";

    users.forEach(user => {
        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${user.id}</td>
            <td>${user.name}</td>
            <td>${user.email}</td>
            <td class="action-buttons">
                <button class="edit-btn" onclick="editUser(${user.id})">編集</button>
                <button class="delete-btn" onclick="deleteUser(${user.id})">削除</button>
            </td>
        `;

        tbody.appendChild(row);
    });
}

function saveUser() {
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");

    const name = nameInput.value.trim();
    const email = emailInput.value.trim();

    if (!name || !email) {
        alert("氏名とメールアドレスを入力してください。");
        return;
    }

    if (editingId === null) {
        users.push({
            id: nextId++,
            name: name,
            email: email
        });
    } else {
        const user = users.find(u => u.id === editingId);

        if (user) {
            user.name = name;
            user.email = email;
        }

        editingId = null;
        document.getElementById("saveButton").textContent = "登録";
    }

    nameInput.value = "";
    emailInput.value = "";

    renderTable();
}

function editUser(id) {
    const user = users.find(u => u.id === id);

    if (!user) {
        return;
    }

    document.getElementById("name").value = user.name;
    document.getElementById("email").value = user.email;

    editingId = id;
    document.getElementById("saveButton").textContent = "更新";
}

function deleteUser(id) {
    if (!confirm("削除しますか？")) {
        return;
    }

    users = users.filter(user => user.id !== id);

    if (editingId === id) {
        editingId = null;
        document.getElementById("name").value = "";
        document.getElementById("email").value = "";
        document.getElementById("saveButton").textContent = "登録";
    }

    renderTable();
}

document
    .getElementById("saveButton")
    .addEventListener("click", saveUser);

renderTable();
</script>

</body>
</html>
