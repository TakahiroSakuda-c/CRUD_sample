<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社員管理CRUDサンプル</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">
    <h1>社員管理CRUDサンプル</h1>

    <div class="form-area">
        <input type="text" id="name" placeholder="氏名">
        <input type="email" id="email" placeholder="メールアドレス">
        <button id="saveButton" class="save-btn">登録</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>氏名</th>
                <th>メールアドレス</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="userTableBody"></tbody>
    </table>
</div>

<script src="js/userStore.js" defer></script>
<script src="js/app.js" defer></script>

</body>
</html>
